[project]
name = "visutask-backend"
version = "0.1.0"
description = "Kanban like api project"
authors = [
    { name = "Álvaro Martínez", email = "minvdev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.17.1",
    "argon2-cffi~=25.1.0",
    "cachetools~=7.1.8",
    "fastapi[standard]~=0.121.1",
    "httpx~=0.28.1",
    "passlib~=1.7.4",
    "psycopg2-binary~=2.9.11",
    "pydantic-settings~=2.12.0",
    "pydantic~=2.12.4",
    "python-jose[cryptography]~=3.5.0",
    "SQLAlchemy~=2.0.44",
]

[dependency-groups]
dev = [
    "freezegun~=1.5.5",
    "mypy~=2.4.0",
    "pytest-asyncio~=1.4.0",
    "pytest~=9.0.1",
    "respx~=0.23.1",
    "ruff~=0.16.10",
    "types-passlib~=1.7.7",
    "types-python-jose~=3.5.0",
]

[project.scripts]
visutask-shell = "app.shell:main"
                                                                                                      
[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

# Pytest
[tool.pytest]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:starlette.*",
]

# Mypy
[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
plugins = ["pydantic.mypy"]

# Ruff
[tool.ruff]
src = ["src"]
line-length = 88 # Explicit default value
indent-width = 4 # Explicit default value

[tool.ruff.lint]
select = [
    "E", # pycode style
    "F", # Pyflakes
    "I", # Isort
    "TID252" # realtive imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
